<rect x="291.80" y="123.31" width="190" height="371.69" fill="#2678b2" rx="4"/>
<text class="label" x="386.79999999999995" y="111.31" text-anchor="middle">95.30%</text>
<text class="axis" x="386.79999999999995" y="525" text-anchor="middle">Matched control</text>
<rect x="678.20" y="231.51" width="190" height="263.49" fill="#dc7f35" rx="4"/>
