name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check shell syntax
        run: find scripts -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -q

      - name: Compile Python sources
        run: >-
          python3 -m compileall -q
          diagnosis experiments optimizer reporting scripts

  ros2-humble:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      ROS_DISTRO: humble
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST

    steps:
      - uses: actions/checkout@v4
      - uses: ros-tooling/setup-ros@0.7.19
        with:
          required-ros-distributions: humble

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pytest \
            python3-rosdep
          rosdep update
          rosdep install --from-paths ros2_core/src --ignore-src \
            --rosdistro humble -r -y

      - name: Build ROS 2 packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_core
          colcon build \
            --packages-select \
              ai_robot_runtime_interfaces minimal_runtime_demo \
              service_runtime_demo runtime_logger_pkg camera_mock_pkg \
              vlm_planner_pkg robot_action_pkg can_bridge_pkg runtime_bringup \
            --event-handlers console_direct+

      - name: Test ROS 2 packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_core/install/setup.bash
          cd ros2_core
          colcon test \
            --packages-select \
              ai_robot_runtime_interfaces minimal_runtime_demo \
              service_runtime_demo runtime_logger_pkg camera_mock_pkg \
              vlm_planner_pkg robot_action_pkg can_bridge_pkg runtime_bringup \
            --event-handlers console_direct+ \
            --return-code-on-test-failure
          colcon test-result --test-result-base build --verbose
