<text class="tick" x="108" y="344.00" text-anchor="end">40</text>
<line x1="120" y1="261.00" x2="1040" y2="261.00" stroke="#d8dee6" stroke-width="1"/>
<text class="tick" x="108" y="266.00" text-anchor="end">60</text>
<line x1="120" y1="183.00" x2="1040" y2="183.00" stroke="#d8dee6" stroke-width="1"/>
<text class="tick" x="108" y="188.00" text-anchor="end">80</text>
<line x1="120" y1="105.00" x2="1040" y2="105.00" stroke="#d8dee6" stroke-width="1"/>
