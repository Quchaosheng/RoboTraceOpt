<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640">
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1d2733}.title{font-size:25px;font-weight:700}.subtitle{font-size:15px}.axis{font-size:15px}.tick{font-size:13px}.label{font-size:14px;font-weight:700}.note{font-size:13px}</style>
<title>F4 application-level blocking delay</title>
<rect width="100%" height="100%" fill="white"/>
<text class="title" x="60" y="48">F4 blocking delay: median application-level latency</text>
<text class="subtitle" x="60" y="75">Formal Ubuntu 24.04/Jazzy test partition; ten runs per condition</text>
<line x1="120" y1="495" x2="1040" y2="495" stroke="#1d2733" stroke-width="1.5"/>
<line x1="120" y1="105" x2="120" y2="495" stroke="#1d2733" stroke-width="1.5"/>
<text class="axis" transform="translate(28 300.0) rotate(-90)" text-anchor="middle">Median elapsed time (ms)</text>
<line x1="120" y1="495.00" x2="1040" y2="495.00" stroke="#d8dee6" stroke-width="1"/>
<text class="tick" x="108" y="500.00" text-anchor="end">0</text>
<line x1="120" y1="408.99" x2="1040" y2="408.99" stroke="#d8dee6" stroke-width="1"/>
<text class="tick" x="108" y="413.99" text-anchor="end">25</text>
<line x1="120" y1="322.98" x2="1040" y2="322.98" stroke="#d8dee6" stroke-width="1"/>
<text class="tick" x="108" y="327.98" text-anchor="end">50</text>
<line x1="120" y1="236.97" x2="1040" y2="236.97" stroke="#d8dee6" stroke-width="1"/>
<text class="tick" x="108" y="241.97" text-anchor="end">75</text>
<line x1="120" y1="150.96" x2="1040" y2="150.96" stroke="#d8dee6" stroke-width="1"/>
<text class="tick" x="108" y="155.96" text-anchor="end">100</text>
<rect x="260.60" y="494.97" width="105" height="0.03" fill="#2678b2" rx="4"/>
<text class="label" x="313.10" y="482.97" text-anchor="middle">0.009</text>
<rect x="389.60" y="150.31" width="105" height="344.69" fill="#dc7f35" rx="4"/>
<text class="label" x="442.10" y="138.31" text-anchor="middle">100.188</text>
<text class="axis" x="377.6" y="525" text-anchor="middle">Server processing</text>
<rect x="665.40" y="491.99" width="105" height="3.01" fill="#2678b2" rx="4"/>
<text class="label" x="717.90" y="479.99" text-anchor="middle">0.875</text>
<rect x="794.40" y="146.79" width="105" height="348.21" fill="#dc7f35" rx="4"/>
<text class="label" x="846.90" y="134.79" text-anchor="middle">101.212</text>
<text class="axis" x="782.4" y="525" text-anchor="middle">Request-response</text>
<rect x="815" y="113" width="16" height="16" fill="#2678b2" rx="2"/>
<text class="tick" x="838" y="126">Matched control</text>
<rect x="815" y="139" width="16" height="16" fill="#dc7f35" rx="2"/>
<text class="tick" x="838" y="152">F4 injected</text>
<text class="note" x="120" y="598">The injected profile configures a 100 ms server delay. The evidence is application-level; it does not assert syscall-level attribution.</text>
</svg>
