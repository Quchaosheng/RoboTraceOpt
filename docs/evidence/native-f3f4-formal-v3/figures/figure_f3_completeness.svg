<line x1="120" y1="495.00" x2="1040" y2="495.00" stroke="#d8dee6" stroke-width="1"/>
<text class="tick" x="108" y="500.00" text-anchor="end">0</text>
<line x1="120" y1="417.00" x2="1040" y2="417.00" stroke="#d8dee6" stroke-width="1"/>
<text class="tick" x="108" y="422.00" text-anchor="end">20</text>
